name: Docker Build

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY_SERVER: git.dotnot.pl
  IMAGE_NAME: karol.kozlowski/appapi-canary

jobs:
  build:
    runs-on: docker
    container:
      image: alpine:latest

    steps:
      - name: Set up Docker CLI
        run: |
          apk add --no-cache nodejs git docker-cli curl

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_SERVER }}
          username: ${{ secrets.RELEASE_USER }}
          password: ${{ secrets.RELEASE_SECRET }}

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push latest
        if: github.ref_name == 'main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Build and push development image
        if: github.ref_name == 'dev'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:dev

      - name: Build and push release image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY_SERVER }}/${{ env.IMAGE_NAME }}:latest